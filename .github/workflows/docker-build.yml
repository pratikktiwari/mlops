name: Docker Build and Push

on:
  push:
    branches:
      - develop
      - Docker_image

  pull_request:
    branches:
      - main
      - develop
     

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
      
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
      
        - name: Build image
          run: |
            docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-group-project.
    
        - name: Push image
          run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/mlops-group-project

 
